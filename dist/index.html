<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- 默认桌面：按设备宽度；手机在下方脚本里改成固定宽布局以便整体缩小 + 双指缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="viewport-meta" />
    <script>
      (function () {
        var ua = navigator.userAgent || ''
        var isPhone =
          /Android.+Mobile|iPhone|iPod|Windows Phone|webOS|BlackBerry|IEMobile/i.test(ua) ||
          (/Mobile/i.test(ua) && Math.min(screen.width, screen.height) <= 820)
        if (!isPhone) return
        var meta = document.getElementById('viewport-meta')
        if (!meta) return
        // 按桌面宽度排版，浏览器自动缩放到屏幕；允许双指放大看细节
        meta.setAttribute('content', 'width=1280, user-scalable=yes')
      })()
    </script>

</html>
